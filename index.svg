<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Небо -->
  <rect width="800" height="300" fill="#87CEEB"/>
  
  <!-- Солнце -->
  <circle cx="680" cy="80" r="50" fill="#FFD700"/>
  <g stroke="#FFD700" stroke-width="4" stroke-linecap="round">
    <line x1="680" y1="15" x2="680" y2="0"/>
    <line x1="680" y1="145" x2="680" y2="160"/>
    <line x1="615" y1="80" x2="600" y2="80"/>
    <line x1="745" y1="80" x2="760" y2="80"/>
    <line x1="634" y1="34" x2="623" y2="23"/>
    <line x1="726" y1="126" x2="737" y2="137"/>
    <line x1="726" y1="34" x2="737" y2="23"/>
    <line x1="634" y1="126" x2="623" y2="137"/>
  </g>
  
  <!-- Облака -->
  <g fill="white">
    <circle cx="120" cy="70" r="30"/>
    <circle cx="150" cy="55" r="35"/>
    <circle cx="180" cy="70" r="28"/>
    <circle cx="155" cy="80" r="25"/>
    
    <circle cx="400" cy="50" r="25"/>
    <circle cx="430" cy="40" r="30"/>
    <circle cx="460" cy="55" r="22"/>
    <circle cx="440" cy="65" r="20"/>
  </g>
  
  <!-- Трава (основной фон) -->
  <rect x="0" y="280" width="800" height="220" fill="#4CAF50"/>
  
  <!-- Дальние холмы -->
  <ellipse cx="200" cy="280" rx="250" ry="40" fill="#66BB6A"/>
  <ellipse cx="600" cy="280" rx="300" ry="35" fill="#5CB860"/>
  
  <!-- Травяной покров с деталями -->
  <g fill="#388E3C">
    <!-- Травинки по всей поляне -->
    <path d="M50,500 Q55,460 60,500"/>
    <path d="M100,500 Q105,450 110,500"/>
    <path d="M150,500 Q155,465 160,500"/>
    <path d="M200,500 Q205,455 210,500"/>
    <path d="M300,500 Q305,460 310,500"/>
    <path d="M400,500 Q405,450 410,500"/>
    <path d="M500,500 Q505,465 510,500"/>
    <path d="M550,500 Q555,455 560,500"/>
    <path d="M650,500 Q655,460 660,500"/>
    <path d="M700,500 Q705,450 710,500"/>
    <path d="M750,500 Q755,465 760,500"/>
  </g>
  
  <!-- Цветочки -->
  <g>
    <circle cx="80" cy="420" r="5" fill="#FFC107"/>
    <circle cx="80" cy="420" r="2" fill="#FF9800"/>
    <circle cx="250" cy="450" r="6" fill="#E91E63"/>
    <circle cx="250" cy="450" r="2.5" fill="#F48FB1"/>
    <circle cx="450" cy="430" r="5" fill="#9C27B0"/>
    <circle cx="450" cy="430" r="2" fill="#CE93D8"/>
    <circle cx="600" cy="460" r="5" fill="#FF5722"/>
    <circle cx="600" cy="460" r="2" fill="#FFAB91"/>
    <circle cx="720" cy="440" r="6" fill="#2196F3"/>
    <circle cx="720" cy="440" r="2.5" fill="#90CAF9"/>
  </g>
  
  <!-- БЕЛЫЙ ГРИБ (слева) -->
  <g transform="translate(200, 310)">
    <!-- Ножка -->
    <path d="M-15,0 Q-20,60 -15,120 Q0,135 15,120 Q20,60 15,0 Z" fill="#F5F5DC" stroke="#D2B48C" stroke-width="2"/>
    <!-- Утолщение ножки (клубень) -->
    <ellipse cx="0" cy="115" rx="18" ry="10" fill="#F5F5DC" stroke="#D2B48C" stroke-width="2"/>
    <!-- Юбочка (кольцо) -->
    <path d="M-18,50 Q0,60 18,50" fill="none" stroke="#D2B48C" stroke-width="3"/>
    <!-- Шляпка -->
    <ellipse cx="0" cy="-10" rx="45" ry="30" fill="#8B4513"/>
    <ellipse cx="0" cy="-15" rx="42" ry="25" fill="#A0522D"/>
    <!-- Нижняя сторона шляпки (губчатый слой) -->
    <path d="M-42,-5 Q0,5 42,-5" fill="#DEB887" stroke="#8B4513" stroke-width="1.5"/>
    <!-- Светлые пятна на шляпке -->
    <ellipse cx="-15" cy="-20" rx="8" ry="5" fill="#C77C3A" opacity="0.6"/>
    <ellipse cx="10" cy="-25" rx="6" ry="4" fill="#C77C3A" opacity="0.6"/>
    <!-- Блики -->
    <ellipse cx="-25" cy="-30" rx="4" ry="2" fill="#E8B87A" opacity="0.5"/>
  </g>
  
  <!-- МУХОМОР (справа) -->
  <g transform="translate(550, 300)">
    <!-- Ножка -->
    <path d="M-12,0 Q-15,70 -10,130 Q0,145 10,130 Q15,70 12,0 Z" fill="#F0F0F0" stroke="#BDBDBD" stroke-width="2"/>
    <!-- Утолщение ножки -->
    <ellipse cx="0" cy="125" rx="15" ry="8" fill="#F0F0F0" stroke="#BDBDBD" stroke-width="2"/>
    <!-- Юбочка -->
    <path d="M-15,55 Q0,65 15,55" fill="none" stroke="#BDBDBD" stroke-width="3"/>
    <!-- Шляпка -->
    <ellipse cx="0" cy="-15" rx="55" ry="35" fill="#D32F2F"/>
    <ellipse cx="0" cy="-20" rx="52" ry="30" fill="#E53935"/>
    <!-- Белые точки на шляпке -->
    <circle cx="-25" cy="-35" r="6" fill="white"/>
    <circle cx="-5" cy="-45" r="5" fill="white"/>
    <circle cx="20" cy="-40" r="7" fill="white"/>
    <circle cx="35" cy="-25" r="5" fill="white"/>
    <circle cx="-40" cy="-20" r="4" fill="white"/>
    <circle cx="10" cy="-25" r="4" fill="white"/>
    <circle cx="-15" cy="-15" r="5" fill="white"/>
    <circle cx="0" cy="-10" r="4" fill="white"/>
    <circle cx="25" cy="-15" r="3" fill="white"/>
    <!-- Блик -->
    <ellipse cx="-30" cy="-45" rx="6" ry="3" fill="#FF8A80" opacity="0.6"/>
  </g>
  
  <!-- Дополнительная трава вокруг грибов -->
  <g fill="#2E7D32">
    <path d="M155,430 Q160,410 165,430"/>
    <path d="M245,430 Q250,405 255,430"/>
    <path d="M500,420 Q505,400 510,420"/>
    <path d="M600,420 Q605,405 610,420"/>
  </g>
  
  <!-- Маленький грибок-подберезовик (для украшения) -->
  <g transform="translate(380, 400)">
    <path d="M-5,0 Q-6,30 -5,50 Q0,55 5,50 Q6,30 5,0 Z" fill="#E8DCC8" stroke="#C2A878" stroke-width="1.5"/>
    <ellipse cx="0" cy="-5" rx="15" ry="10" fill="#C97E3A"/>
    <ellipse cx="0" cy="-8" rx="13" ry="7" fill="#D98A4A"/>
  </g>
  
  <!-- Стрекоза или бабочка (для живости) -->
  <g transform="translate(470, 200)">
    <ellipse cx="-8" cy="0" rx="8" ry="4" fill="#FFB74D" opacity="0.7"/>
    <ellipse cx="8" cy="0" rx="8" ry="4" fill="#FFB74D" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="2" ry="6" fill="#FF9800"/>
  </g>
</svg>

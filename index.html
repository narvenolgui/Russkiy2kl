<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Мир насекомых · Для детей с ЗПР (7.1)</title>
    <!-- Стили -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            background: #e8f5e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
        }
        .app-container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 15px 30px rgba(0, 40, 0, 0.2);
            padding: 24px 24px 32px;
            border: 3px solid #4caf50;
            transition: all 0.2s;
        }
        h1, h2 {
            color: #1b5e20;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 2.3rem;
            margin: 5px 0 10px;
            text-shadow: 2px 2px 0 #c8e6c9;
        }
        h2 {
            font-size: 1.8rem;
            margin: 15px 0 10px;
            border-bottom: 3px dotted #81c784;
            padding-bottom: 8px;
        }
        .screen {
            display: block;
        }
        .hidden {
            display: none !important;
        }
        /* Слайд-зона */
        .slide-area {
            background: #f1f8e9;
            border-radius: 30px;
            padding: 20px 20px 25px;
            margin: 10px 0 20px;
            border: 2px solid #a5d6a7;
            box-shadow: inset 0 0 0 2px #ffffff, 0 8px 0 #2e7d32;
        }
        .slide-content {
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .slide-text {
            font-size: 1.8rem;
            line-height: 1.4;
            text-align: center;
            color: #1e3a1e;
            margin: 15px 0;
            font-weight: 600;
            background: #fff9c4;
            padding: 20px 15px;
            border-radius: 50px;
            border: 2px solid #f9a825;
            width: 100%;
            box-shadow: 0 4px 0 #b26a00;
        }
        .slide-icon {
            font-size: 5rem;
            margin: 5px 0;
        }
        .fact-badge {
            background: #ffecb3;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 1.5rem;
            border: 2px solid #ffa000;
            color: #3e2723;
            margin-top: 10px;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 12px;
        }
        button {
            background: #4caf50;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.8rem;
            padding: 16px 30px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 7px 0 #1b5e20;
            transition: 0.07s;
            border: 2px solid #a5d6a7;
            flex: 1;
            text-align: center;
            min-width: 120px;
            letter-spacing: 2px;
        }
        button.small-btn {
            font-size: 1.5rem;
            padding: 12px 20px;
            box-shadow: 0 5px 0 #1b5e20;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #1b5e20;
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 7px 0 #1b5e20;
            pointer-events: none;
        }
        .speak-btn {
            background: #ff9800;
            box-shadow: 0 5px 0 #b85e00;
            border-color: #ffe0b2;
            font-size: 1.5rem;
            padding: 10px 25px;
            flex: 0.5;
        }
        .speak-btn i {
            margin-right: 8px;
        }
        /* Тест */
        .test-container {
            background: #e1f5fe;
            border-radius: 30px;
            padding: 20px;
            border: 3px solid #0288d1;
            margin-top: 15px;
        }
        .question {
            font-size: 2rem;
            font-weight: bold;
            color: #01579b;
            margin-bottom: 25px;
            text-align: center;
            background: #b3e5fc;
            padding: 15px;
            border-radius: 30px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: #ffffff;
            color: #1e3a1e;
            box-shadow: 0 5px 0 #78909c;
            border: 3px solid #4fc3f7;
            font-size: 1.6rem;
            padding: 18px 5px;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.1s;
            text-align: center;
        }
        .option-btn.selected {
            background: #ffd54f;
            border: 4px solid #f57f17;
            box-shadow: 0 3px 0 #b26a00;
            transform: translateY(2px);
        }
        .feedback {
            font-size: 1.8rem;
            padding: 10px;
            text-align: center;
            border-radius: 40px;
            margin: 15px 0;
            font-weight: bold;
        }
        .correct-feedback {
            background: #c8e6c9;
            color: #1b5e20;
        }
        .wrong-feedback {
            background: #ffcdd2;
            color: #b71c1c;
        }
        .test-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .result-screen {
            text-align: center;
            font-size: 2.5rem;
            padding: 20px;
        }
        .counter {
            font-size: 1.4rem;
            color: #33691e;
            text-align: right;
            margin-bottom: 5px;
        }
        /* Картинки заменены крупными эмодзи/символами, но наглядно */
        .img-emojii {
            font-size: 4.5rem;
            line-height: 1.2;
        }
        /* Для мобильных */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .slide-text { font-size: 1.4rem; }
            button { font-size: 1.4rem; padding: 14px 10px; }
            .options { grid-template-columns: 1fr; }
        }
    </style>
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-container" id="appContainer">
    <h1><i class="fas fa-bug"></i> НАСЕКОМЫЕ <i class="fas fa-butterfly"></i></h1>
    
    <!-- ЭКРАН СЛАЙДОВ -->
    <div id="slidesScreen">
        <div class="counter" id="slideCounter">Слайд 1 / 13</div>
        <div class="slide-area">
            <div class="slide-content" id="slideContent">
                <!-- динамически заполняется JS -->
            </div>
            <div style="display: flex; justify-content: center; margin: 10px 0;">
                <button class="speak-btn" id="speakSlideBtn"><i class="fas fa-volume-up"></i> Послушать</button>
            </div>
        </div>
        <div class="nav-buttons">
            <button id="prevSlideBtn" disabled><i class="fas fa-arrow-left"></i> Назад</button>
            <button id="nextSlideBtn">Далее <i class="fas fa-arrow-right"></i></button>
        </div>
        <div style="text-align: center; margin-top: 25px;">
            <button id="goToTestBtn" class="small-btn" style="background: #ffb300; box-shadow:0 5px 0 #b26a00;"><i class="fas fa-pencil-alt"></i> ПЕРЕЙТИ К ТЕСТУ</button>
        </div>
    </div>

    <!-- ЭКРАН ТЕСТА (изначально скрыт) -->
    <div id="testScreen" class="hidden">
        <h2><i class="fas fa-question-circle"></i> ПРОВЕРЬ СЕБЯ</h2>
        <div class="test-container">
            <div id="testHeader">
                <span style="font-size:1.8rem; font-weight:bold;" id="questionNumDisplay">Вопрос 1 из 5</span>
            </div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div id="feedbackArea" class="feedback"></div>
            <div class="test-nav">
                <button id="checkAnswerBtn" class="small-btn" style="background:#0277bd; box-shadow:0 5px 0 #01416b;">✅ Проверить</button>
                <button id="nextQuestionBtn" class="small-btn" disabled>Следующий ➡️</button>
            </div>
            <div style="margin-top:20px;">
                <button id="backToSlidesFromTest" class="small-btn" style="background:#78909c; box-shadow:0 5px 0 #455a64;"><i class="fas fa-undo-alt"></i> К слайдам</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТОВ (внутри тестового экрана, показывается после завершения) -->
    <div id="resultScreen" class="hidden">
        <div class="result-screen">
            <i class="fas fa-trophy" style="font-size:5rem; color:#f9a825;"></i>
            <h2>Ты молодец!</h2>
            <div style="font-size:2.5rem; margin:20px 0;" id="resultMessage"></div>
            <button id="restartLessonBtn" class="small-btn" style="background:#4caf50; box-shadow:0 7px 0 #1b5e20; margin-top:20px;"><i class="fas fa-redo-alt"></i> Посмотреть ещё раз</button>
        </div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- ДАННЫЕ СЛАЙДОВ (соответствуют АООП 7.1, тема "Насекомые") ----------
        const slides = [
            { text: "Удивительный мир насекомых", icon: "🐞🐝🦋", extra: "На Земле больше 1 миллиона видов!" },
            { text: "Главный признак насекомых", icon: "6️⃣", extra: "У всех насекомых ШЕСТЬ ног! Запомни: 6 ног — значит, насекомое." },
            { text: "Строение насекомого", icon: "🐜", extra: "Голова, грудь, брюшко. И 6 ножек от груди." },
            { text: "Кто лишний?", icon: "🕷️❌", extra: "Паук — НЕ насекомое! У него 8 ног. А у жука и бабочки — 6." },
            { text: "Бабочка", icon: "🦋🌸", extra: "Похожа на цветок. Пьёт нектар хоботком. Гусеница → куколка → бабочка." },
            { text: "Божья коровка", icon: "🐞", extra: "Помощник садовода! Поедает тлю — маленьких вредителей." },
            { text: "Пчела и муравей", icon: "🐝🐜", extra: "Труженики! Пчёлы делают мёд. Муравьи живут в муравейнике." },
            { text: "Кузнечик и стрекоза", icon: "🦗🪰", extra: "Кузнечик — мастер маскировки. Стрекоза — воздушный охотник." },
            { text: "Где живут насекомые?", icon: "🌍", extra: "Везде: в лесу, в поле, у воды, под землёй и даже дома!" },
            { text: "Береги насекомых!", icon: "🤲❤️", extra: "Не обижай, не ломай муравейники. Наблюдай и любуйся!" },
            { text: "Давай повторим!", icon: "🧠", extra: "Сколько ног? (6) Кто делает мёд? (пчела) Кто ест тлю? (божья коровка)" },
            { text: "Ты готов к тесту?", icon: "📋✅", extra: "Сейчас проверим, что ты запомнил!" },
            { text: "ПЕРЕХОДИ К ТЕСТУ", icon: "👇🔍", extra: "Нажми большую жёлтую кнопку внизу." }
        ];

        // ---------- ДАННЫЕ ТЕСТА (5 вопросов) ----------
        const questions = [
            {
                question: "Кто из них — насекомое?",
                options: ["🦋 Бабочка", "🕷️ Паук", "🐛 Червяк", "🦂 Скорпион"],
                correct: 0
            },
            {
                question: "Сколько ног у насекомых?",
                options: ["4", "6", "8", "Много"],
                correct: 1
            },
            {
                question: "Найди части тела насекомого (выбери правильные)",
                options: ["Голова, грудь, брюшко", "Голова, туловище, хвост", "Голова, ноги, крылья", "Только голова и брюшко"],
                correct: 0
            },
            {
                question: "Кто приносит пользу, поедая тлю?",
                options: ["🦟 Комар", "🐞 Божья коровка", "🪰 Муха", "🐛 Гусеница"],
                correct: 1
            },
            {
                question: "Где живут насекомые?",
                options: ["Только в лесу", "Только дома", "Только в воде", "Везде"],
                correct: 3
            }
        ];

        // ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----------
        let currentSlideIndex = 0;
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null); // храним выбранный индекс
        let testCompleted = false;
        let selectedOption = null; // для текущего вопроса

        // Экраны
        const slidesScreen = document.getElementById('slidesScreen');
        const testScreen = document.getElementById('testScreen');
        const resultScreen = document.getElementById('resultScreen');
        const slideContent = document.getElementById('slideContent');
        const slideCounter = document.getElementById('slideCounter');
        const prevBtn = document.getElementById('prevSlideBtn');
        const nextBtn = document.getElementById('nextSlideBtn');
        const goToTestBtn = document.getElementById('goToTestBtn');
        const speakSlideBtn = document.getElementById('speakSlideBtn');
        
        const questionText = document.getElementById('questionText');
        const optionsDiv = document.getElementById('optionsContainer');
        const checkBtn = document.getElementById('checkAnswerBtn');
        const nextQuestionBtn = document.getElementById('nextQuestionBtn');
        const feedbackArea = document.getElementById('feedbackArea');
        const questionNumDisplay = document.getElementById('questionNumDisplay');
        const backToSlidesFromTest = document.getElementById('backToSlidesFromTest');
        const restartLessonBtn = document.getElementById('restartLessonBtn');
        const resultMessage = document.getElementById('resultMessage');

        // ---------- ФУНКЦИИ ДЛЯ СЛАЙДОВ ----------
        function renderSlide(index) {
            const slide = slides[index];
            let html = `<div class="slide-icon img-emojii">${slide.icon}</div>`;
            html += `<div class="slide-text">${slide.text}</div>`;
            if (slide.extra) {
                html += `<div class="fact-badge"><i class="fas fa-star"></i> ${slide.extra}</div>`;
            }
            slideContent.innerHTML = html;
            slideCounter.textContent = `Слайд ${index+1} / ${slides.length}`;
            
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === slides.length - 1);
            if (index === slides.length - 1) {
                nextBtn.textContent = '🏁 Конец';
            } else {
                nextBtn.innerHTML = 'Далее <i class="fas fa-arrow-right"></i>';
            }
        }

        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                renderSlide(currentSlideIndex);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide(currentSlideIndex);
            }
        }

        // Озвучка текста слайда (Web Speech API)
        function speakSlideText() {
            const slide = slides[currentSlideIndex];
            let textToSpeak = slide.text + ". " + (slide.extra || "");
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Озвучивание не поддерживается вашим браузером.");
            }
        }

        // ---------- ФУНКЦИИ ТЕСТА ----------
        function showTestScreen() {
            slidesScreen.classList.add('hidden');
            testScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            resetTestState();
            renderQuestion(currentQuestionIndex);
        }

        function resetTestState() {
            currentQuestionIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            testCompleted = false;
            selectedOption = null;
            nextQuestionBtn.disabled = true;
            checkBtn.disabled = false;
            feedbackArea.innerHTML = '';
            feedbackArea.className = 'feedback';
        }

        function renderQuestion(qIndex) {
            const q = questions[qIndex];
            questionText.textContent = q.question;
            questionNumDisplay.textContent = `Вопрос ${qIndex+1} из ${questions.length}`;
            
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                const isSelected = (userAnswers[qIndex] === idx);
                optionsHtml += `<button class="option-btn ${isSelected ? 'selected' : ''}" data-opt-index="${idx}">${opt}</button>`;
            });
            optionsDiv.innerHTML = optionsHtml;
            
            // Если уже был ответ на этот вопрос, блокируем кнопку проверки и показываем результат
            if (userAnswers[qIndex] !== null) {
                checkBtn.disabled = true;
                const isCorrect = (userAnswers[qIndex] === q.correct);
                showFeedbackForCurrentQuestion(isCorrect);
                nextQuestionBtn.disabled = false;
                // выделяем правильный и неправильный? Не будем перегружать, но покажем обратную связь
            } else {
                checkBtn.disabled = false;
                nextQuestionBtn.disabled = true;
                feedbackArea.innerHTML = '';
                feedbackArea.className = 'feedback';
                selectedOption = null;
            }
            
            // Вешаем обработчики на опции
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (userAnswers[qIndex] !== null) return; // уже ответили
                    const optIndex = parseInt(btn.dataset.optIndex);
                    selectedOption = optIndex;
                    // убираем выделение у всех
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });
        }

        function showFeedbackForCurrentQuestion(isCorrect) {
            const q = questions[currentQuestionIndex];
            if (isCorrect) {
                feedbackArea.innerHTML = '<i class="fas fa-check-circle"></i> Правильно! Молодец!';
                feedbackArea.className = 'feedback correct-feedback';
            } else {
                const correctAns = q.options[q.correct];
                feedbackArea.innerHTML = `<i class="fas fa-times-circle"></i> Неверно. Правильный ответ: ${correctAns}`;
                feedbackArea.className = 'feedback wrong-feedback';
            }
        }

        function checkAnswer() {
            const qIndex = currentQuestionIndex;
            if (userAnswers[qIndex] !== null) return;
            if (selectedOption === null) {
                alert("Выбери ответ!");
                return;
            }
            const q = questions[qIndex];
            const isCorrect = (selectedOption === q.correct);
            userAnswers[qIndex] = selectedOption;
            
            showFeedbackForCurrentQuestion(isCorrect);
            checkBtn.disabled = true;
            nextQuestionBtn.disabled = false;
            
            // подсветка (уже есть selected)
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                selectedOption = null;
                renderQuestion(currentQuestionIndex);
            } else {
                // завершить тест, показать результат
                finishTest();
            }
        }

        function finishTest() {
            testScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            const correctCount = userAnswers.reduce((acc, ans, idx) => acc + (ans === questions[idx].correct ? 1 : 0), 0);
            let message = `Ты ответил правильно на ${correctCount} из ${questions.length}. `;
            if (correctCount === questions.length) message += "Отлично! Ты всё запомнил!";
            else if (correctCount >= 3) message += "Хорошо! Но можно повторить слайды.";
            else message += "Давай ещё раз посмотрим слайды, и всё получится!";
            resultMessage.textContent = message;
        }

        function goBackToSlides() {
            testScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            slidesScreen.classList.remove('hidden');
            // сброс слайдов не делаем, пусть остаются на том же месте, но можно перемотать?
            // оставим текущий слайд
        }

        function restartLesson() {
            currentSlideIndex = 0;
            renderSlide(0);
            slidesScreen.classList.remove('hidden');
            testScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            resetTestState();
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ И ПРИВЯЗКА СОБЫТИЙ ----------
        function init() {
            renderSlide(0);
            
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            speakSlideBtn.addEventListener('click', speakSlideText);
            goToTestBtn.addEventListener('click', showTestScreen);
            
            checkBtn.addEventListener('click', checkAnswer);
            nextQuestionBtn.addEventListener('click', nextQuestion);
            backToSlidesFromTest.addEventListener('click', goBackToSlides);
            restartLessonBtn.addEventListener('click', restartLesson);
            
            // дополнительно: если клик по кнопке "далее" на последнем слайде - ничего
        }

        init();
    })();
</script>
</body>
</html>

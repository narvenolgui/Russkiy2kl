<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Парные согласные | 2 класс | Тренажёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #3b8c5a, #22663f);
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            max-width: 700px;
            width: 100%;
            background: #fef3da;
            border-radius: 72px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3), inset 0 1px 4px rgba(255,250,210,0.9);
            overflow: hidden;
        }
        .header {
            background: #ffb347;
            padding: 18px 20px;
            text-align: center;
            border-bottom: 5px solid #e6891e;
            position: relative;
        }
        .header h1 {
            font-size: 2rem;
            color: #2d2b1f;
            text-shadow: 2px 2px 0 #ffdd99;
        }
        .header p {
            font-size: 1rem;
            background: #fff0c0;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 40px;
            font-weight: bold;
        }
        .score-badge {
            position: absolute;
            right: 20px;
            top: 20px;
            background: #ffdc97;
            padding: 5px 15px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .main-card {
            padding: 20px 25px 30px;
        }
        .rule-box {
            background: #fff6e8;
            border-radius: 60px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 0 #e0bc7c;
            border: 2px solid #ffd699;
            margin-bottom: 20px;
        }
        .rule-title {
            font-size: 2rem;
            font-weight: 900;
            background: #ffedb5;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 80px;
            margin-bottom: 20px;
            color: #b33c0c;
        }
        .rule-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }
        .pair-card {
            background: #ffe0a3;
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #3d2b1a;
        }
        .rule-example {
            font-size: 1.5rem;
            background: #fff1df;
            padding: 15px;
            border-radius: 50px;
            margin-top: 10px;
            font-weight: bold;
            color: #2a6b47;
        }
        .rule-hint {
            font-size: 1.2rem;
            margin-top: 15px;
            background: #ffe0a3;
            padding: 10px;
            border-radius: 40px;
        }
        .task-card {
            background: #fff9ef;
            border-radius: 60px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 0 #e0bc7c;
            border: 2px solid #ffda9e;
        }
        .progress {
            background: #ffecb3;
            padding: 8px 18px;
            border-radius: 60px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .word-display {
            font-size: 2.8rem;
            font-weight: bold;
            background: #eef3e0;
            padding: 20px;
            border-radius: 60px;
            margin: 15px 0;
            letter-spacing: 4px;
            color: #2b4b2c;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .opt-btn {
            background: #f3d382;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.05s linear;
            box-shadow: 0 5px 0 #b97f2e;
            color: #2e2a1f;
            min-width: 85px;
        }
        .opt-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b97f2e;
        }
        .opt-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: default;
        }
        .feedback {
            margin-top: 20px;
            padding: 12px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .correct-feedback {
            background: #c8e6c9;
            color: #1e5a2a;
            border-left: 8px solid #2e7d32;
        }
        .wrong-feedback {
            background: #ffcdd2;
            color: #a1131e;
            border-left: 8px solid #d32f2f;
        }
        .next-btn {
            background: #ffaa44;
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 60px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: 0.1s;
        }
        .next-btn:active {
            transform: scale(0.97);
        }
        .final-message {
            background: #f7e2b2;
            border-radius: 48px;
            padding: 25px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .copyright {
            text-align: center;
            font-size: 0.7rem;
            padding: 12px;
            color: #d8c27c;
            background: #2c5a3b;
        }
        button {
            user-select: none;
        }
        @media (max-width: 550px) {
            .word-display { font-size: 2rem; }
            .opt-btn { font-size: 1.3rem; padding: 8px 18px; min-width: 70px; }
            .rule-title { font-size: 1.5rem; }
            .score-badge { position: static; display: inline-block; margin-top: 8px; }
            .header { text-align: center; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <div class="header">
        <h1>📖 Парные согласные</h1>
        <p>б-п · в-ф · г-к · д-т · ж-ш · з-с</p>
        <div class="score-badge" id="globalScoreDisplay">⭐ 0 баллов</div>
    </div>
    <div class="main-card" id="mainContent"></div>
    <div class="copyright">
        Интерактивный тренажёр · 2 класс · Русский язык
    </div>
</div>

<script>
    // ---------- СЛОВА ДЛЯ КАЖДОЙ ПАРЫ (отработка) ----------
    const pairs = [
        { name: "Б–П", words: [
            { word: "зу_", correct: "б", wrongOptions: ["п"], rule: "Зуб — парная б (проверь: зубы)" },
            { word: "су_", correct: "п", wrongOptions: ["б"], rule: "Суп — парная п (проверь: супы)" },
            { word: "гри_", correct: "б", wrongOptions: ["п"], rule: "Гриб — парная б (проверь: грибы)" }
        ] },
        { name: "В–Ф", words: [
            { word: "жира_", correct: "ф", wrongOptions: ["в"], rule: "Жираф — парная ф (проверь: жирафы)" },
            { word: "рука_", correct: "в", wrongOptions: ["ф"], rule: "Рукав — парная в (проверь: рукава)" },
            { word: "шар_", correct: "ф", wrongOptions: ["в"], rule: "Шарф — парная ф (проверь: шарфы)" }
        ] },
        { name: "Г–К", words: [
            { word: "дру_", correct: "г", wrongOptions: ["к"], rule: "Друг — парная г (проверь: друзья)" },
            { word: "вра_", correct: "г", wrongOptions: ["к"], rule: "Враг — парная г (проверь: враги)" },
            { word: "сапо_", correct: "г", wrongOptions: ["к"], rule: "Сапог — парная г (проверь: сапоги)" }
        ] },
        { name: "Д–Т", words: [
            { word: "сле_", correct: "д", wrongOptions: ["т"], rule: "След — парная д (проверь: следы)" },
            { word: "лё_", correct: "д", wrongOptions: ["т"], rule: "Лёд — парная д (проверь: льды)" },
            { word: "горо_", correct: "д", wrongOptions: ["т"], rule: "Город — парная д (проверь: города)" }
        ] },
        { name: "Ж–Ш", words: [
            { word: "эта_", correct: "ж", wrongOptions: ["ш"], rule: "Этаж — парная ж (проверь: этажи)" },
            { word: "каранда_", correct: "ш", wrongOptions: ["ж"], rule: "Карандаш — парная ш (проверь: карандаши)" },
            { word: "ё_", correct: "ж", wrongOptions: ["ш"], rule: "Ёж — парная ж (проверь: ежи)" }
        ] },
        { name: "З–С", words: [
            { word: "арбу_", correct: "з", wrongOptions: ["с"], rule: "Арбуз — парная з (проверь: арбузы)" },
            { word: "анана_", correct: "с", wrongOptions: ["з"], rule: "Ананас — парная с (проверь: ананасы)" },
            { word: "гла_", correct: "з", wrongOptions: ["с"], rule: "Глаз — парная з (проверь: глаза)" }
        ] }
    ];

    // Смешанный тест (все пары вразнобой)
    const mixedTest = [
        { word: "зу_", correct: "б", pair: "б-п", rule: "Зуб — проверь: зубы" },
        { word: "жира_", correct: "ф", pair: "в-ф", rule: "Жираф — проверь: жирафы" },
        { word: "дру_", correct: "г", pair: "г-к", rule: "Друг — проверь: друзья" },
        { word: "сле_", correct: "д", pair: "д-т", rule: "След — проверь: следы" },
        { word: "эта_", correct: "ж", pair: "ж-ш", rule: "Этаж — проверь: этажи" },
        { word: "арбу_", correct: "з", pair: "з-с", rule: "Арбуз — проверь: арбузы" },
        { word: "вра_", correct: "г", pair: "г-к", rule: "Враг — проверь: враги" },
        { word: "лё_", correct: "д", pair: "д-т", rule: "Лёд — проверь: льды" },
        { word: "каранда_", correct: "ш", pair: "ж-ш", rule: "Карандаш — проверь: карандаши" },
        { word: "анана_", correct: "с", pair: "з-с", rule: "Ананас — проверь: ананасы" },
        { word: "гри_", correct: "б", pair: "б-п", rule: "Гриб — проверь: грибы" },
        { word: "сапо_", correct: "г", pair: "г-к", rule: "Сапог — проверь: сапоги" }
    ];

    // Построение этапов: правило + практика по каждой паре + смешанный тест
    let stages = [
        { type: "rule", title: "Что такое парные согласные?", 
          text: "Звонкие и глухие согласные образуют пары. В конце слова или перед глухим согласным звонкий звук оглушается. Чтобы проверить, измени слово так, чтобы после согласного стоял гласный.",
          pairs: ["б-п", "в-ф", "г-к", "д-т", "ж-ш", "з-с"],
          examples: "зуб — зубы, суп — супы, глаз — глаза" }
    ];
    for (let i = 0; i < pairs.length; i++) {
        stages.push({ type: "practice", pairIndex: i, pairName: pairs[i].name, words: pairs[i].words });
    }
    stages.push({ type: "mixedTest", words: mixedTest, total: mixedTest.length });

    let currentStage = 0;
    let currentSubIndex = 0;
    let globalScore = 0;
    let maxPossible = 0;
    
    let practiceAnswers = {};
    let mixedAnswers = [];

    const mainDiv = document.getElementById('mainContent');
    const scoreDisplay = document.getElementById('globalScoreDisplay');

    // Функция случайного перемешивания массива (Фишера-Йетса)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateScoreUI() {
        scoreDisplay.innerText = `⭐ ${globalScore} баллов`;
    }

    function calcMaxScore() {
        let total = 0;
        for (let st of stages) {
            if (st.type === "practice") total += st.words.length;
            if (st.type === "mixedTest") total += st.words.length;
        }
        return total;
    }

    function nextStage() {
        currentStage++;
        if (currentStage < stages.length) {
            const stage = stages[currentStage];
            if (stage.type === "practice") {
                practiceAnswers = {};
                currentSubIndex = 0;
            } else if (stage.type === "mixedTest") {
                mixedAnswers = stage.words.map(() => ({ answered: false, correct: false, selectedLetter: null }));
                currentSubIndex = 0;
            }
            render();
        } else {
            showFinalScreen();
        }
    }

    function render() {
        if (currentStage >= stages.length) {
            showFinalScreen();
            return;
        }
        const stage = stages[currentStage];
        if (stage.type === "rule") {
            renderRule(stage);
        } else if (stage.type === "practice") {
            renderPractice(stage);
        } else if (stage.type === "mixedTest") {
            renderMixedTest(stage);
        }
    }

    function renderRule(stage) {
        let pairsHtml = `<div class="rule-grid">`;
        for (let p of stage.pairs) {
            pairsHtml += `<div class="pair-card">${p}</div>`;
        }
        pairsHtml += `</div>`;
        const html = `
            <div class="rule-box">
                <div class="rule-title">${stage.title}</div>
                ${pairsHtml}
                <div class="rule-example">✨ Проверяй: ${stage.examples} ✨</div>
                <div class="rule-hint">⭐ Чтобы проверить парную согласную, измени слово: «один — много» или «нет кого? чего?»</div>
                <button class="next-btn" id="nextRuleBtn">➡ Дальше</button>
            </div>
        `;
        mainDiv.innerHTML = html;
        document.getElementById('nextRuleBtn')?.addEventListener('click', () => nextStage());
    }

    function renderPractice(stage) {
        const words = stage.words;
        const idx = currentSubIndex;
        if (idx >= words.length) {
            nextStage();
            return;
        }
        const item = words[idx];
        const displayWord = item.word.replace('_', '___');
        const alreadyAnswered = (practiceAnswers[idx] !== undefined);
        let feedbackHtml = '';
        let disabled = false;

        if (alreadyAnswered) {
            const selected = practiceAnswers[idx];
            const isCorrect = (selected === item.correct);
            feedbackHtml = `
                <div class="feedback ${isCorrect ? 'correct-feedback' : 'wrong-feedback'}">
                    ${isCorrect ? '✅ Верно! ' + item.rule : '❌ Неверно. ' + item.rule + ' Правильная буква — ' + item.correct.toUpperCase() + '.'}
                </div>
            `;
            disabled = true;
        }

        // Собираем массив вариантов и перемешиваем
        let variants = [item.correct, ...item.wrongOptions];
        let shuffledVariants = shuffleArray([...variants]);
        
        let optionsHtml = `<div class="options">`;
        for (let letter of shuffledVariants) {
            optionsHtml += `<button class="opt-btn" data-letter="${letter}" ${disabled ? 'disabled' : ''}>${letter.toUpperCase()}</button>`;
        }
        optionsHtml += `</div>`;

        let nextButtonHtml = '';
        if (alreadyAnswered) {
            nextButtonHtml = `<button class="next-btn" id="nextPracticeBtn">➡ Следующее слово</button>`;
        }

        const html = `
            <div class="task-card">
                <div class="progress">📖 Пара: ${stage.pairName}</div>
                <div class="word-display">${displayWord}</div>
                ${optionsHtml}
                ${feedbackHtml}
                ${nextButtonHtml}
            </div>
        `;
        mainDiv.innerHTML = html;

        if (!alreadyAnswered) {
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (practiceAnswers[idx] !== undefined) return;
                    const chosen = btn.getAttribute('data-letter');
                    practiceAnswers[idx] = chosen;
                    const isCorrect = (chosen === item.correct);
                    if (isCorrect) {
                        globalScore++;
                        updateScoreUI();
                    }
                    renderPractice(stage);
                });
            });
        } else {
            const nextBtn = document.getElementById('nextPracticeBtn');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    currentSubIndex++;
                    renderPractice(stage);
                });
            }
        }
    }

    function renderMixedTest(stage) {
        const words = stage.words;
        const idx = currentSubIndex;
        if (idx >= words.length) {
            showFinalScreen();
            return;
        }
        const item = words[idx];
        const displayWord = item.word.replace('_', '___');
        const answerData = mixedAnswers[idx];
        const alreadyAnswered = answerData.answered;
        let feedbackHtml = '';
        let disabled = false;

        if (alreadyAnswered) {
            disabled = true;
            const isCorrect = answerData.correct;
            feedbackHtml = `
                <div class="feedback ${isCorrect ? 'correct-feedback' : 'wrong-feedback'}">
                    ${isCorrect ? '✅ Правильно! ' + item.rule : '❌ Ошибка. ' + item.rule + ' Нужно вставить букву ' + item.correct.toUpperCase() + '.'}
                </div>
            `;
        }

        let wrongLetter = '';
        if (item.correct === 'б') wrongLetter = 'п';
        else if (item.correct === 'п') wrongLetter = 'б';
        else if (item.correct === 'в') wrongLetter = 'ф';
        else if (item.correct === 'ф') wrongLetter = 'в';
        else if (item.correct === 'г') wrongLetter = 'к';
        else if (item.correct === 'к') wrongLetter = 'г';
        else if (item.correct === 'д') wrongLetter = 'т';
        else if (item.correct === 'т') wrongLetter = 'д';
        else if (item.correct === 'ж') wrongLetter = 'ш';
        else if (item.correct === 'ш') wrongLetter = 'ж';
        else if (item.correct === 'з') wrongLetter = 'с';
        else if (item.correct === 'с') wrongLetter = 'з';
        
        let variants = [item.correct, wrongLetter];
        let shuffledVariants = shuffleArray([...variants]);
        let optionsHtml = `<div class="options">`;
        for (let letter of shuffledVariants) {
            optionsHtml += `<button class="opt-btn" data-letter="${letter}" ${disabled ? 'disabled' : ''}>${letter.toUpperCase()}</button>`;
        }
        optionsHtml += `</div>`;

        let nextButtonHtml = '';
        if (alreadyAnswered) {
            nextButtonHtml = `<button class="next-btn" id="nextMixedBtn">➡ Дальше</button>`;
        }

        const html = `
            <div class="task-card">
                <div class="progress">🧩 Смешанный тест · слово ${idx+1} из ${words.length}</div>
                <div class="word-display">${displayWord}</div>
                ${optionsHtml}
                ${feedbackHtml}
                ${nextButtonHtml}
            </div>
        `;
        mainDiv.innerHTML = html;

        if (!alreadyAnswered) {
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (mixedAnswers[idx].answered) return;
                    const chosen = btn.getAttribute('data-letter');
                    const isCorrect = (chosen === item.correct);
                    mixedAnswers[idx] = { answered: true, correct: isCorrect, selectedLetter: chosen };
                    if (isCorrect) {
                        globalScore++;
                        updateScoreUI();
                    }
                    renderMixedTest(stage);
                });
            });
        } else {
            const nextBtn = document.getElementById('nextMixedBtn');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    currentSubIndex++;
                    renderMixedTest(stage);
                });
            }
        }
    }

    function showFinalScreen() {
        const totalMax = calcMaxScore();
        let message = '';
        if (globalScore === totalMax) {
            message = '🎉🎉🎉 Супер! Ты отлично знаешь парные согласные! Всегда проверяй слова! 🎉🎉🎉';
        } else if (globalScore >= totalMax - 3) {
            message = '👍 Хорошо! Повтори правило: измени слово так, чтобы после согласной был гласный. У тебя получится!';
        } else {
            message = '📚 Попробуй ещё раз. Вспомни: парные согласные нужно проверять — подставляй гласную после них. Тренируйся!';
        }
        const finalHtml = `
            <div class="final-message">
                🏆 ИТОГ: ${globalScore} / ${totalMax} баллов<br>
                ${message}
                <br><br>
                <button id="fullRestartBtn" style="background:#ffaa44; border:none; font-size:1.2rem; padding:10px 25px; border-radius:40px; cursor:pointer;">🔄 Пройти заново</button>
            </div>
        `;
        mainDiv.innerHTML = finalHtml;
        document.getElementById('fullRestartBtn')?.addEventListener('click', () => {
            currentStage = 0;
            currentSubIndex = 0;
            globalScore = 0;
            practiceAnswers = {};
            mixedAnswers = [];
            updateScoreUI();
            render();
        });
    }

    maxPossible = calcMaxScore();
    updateScoreUI();
    render();
</script>
</body>
</html>
